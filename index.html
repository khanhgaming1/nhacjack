<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nkhanhdznhattgioi</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background: #05030a;
      overflow: hidden;
      position: relative;
    }

    /* NỀN ÁNH SÁNG ĐỘNG (GPU) */
    #bg-stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #0c0818 0%, #05030a 70%);
      transform: translateZ(0);
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      opacity: 0.45;
      will-change: transform;
      transform: translateZ(0);
    }

    .blob-1 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #a855f7 0%, transparent 70%);
      top: -10%; left: -10%;
      animation: float1 18s ease-in-out infinite;
    }
    .blob-2 {
      width: 360px; height: 360px;
      background: radial-gradient(circle, #6366f1 0%, transparent 70%);
      bottom: -15%; right: -10%;
      animation: float2 22s ease-in-out infinite;
    }

    @keyframes float1 {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(50px, 60px, 0) scale(1.1); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-60px, -40px, 0) scale(1.05); }
    }

    /* Viền phát sáng */
    #glow-ring {
      position: absolute;
      inset: -2px;
      border-radius: 26px;
      padding: 2px;
      background: conic-gradient(from 0deg, #a855f7, #6366f1, #ec4899, #a855f7);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0.35;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #glow-ring.playing { opacity: 0.75; }

    /* HIỆU ỨNG ÁNH SÁNG QUÉT QUA CARD (LIGHT SWEEP) */
    .light-sweep {
      position: absolute;
      top: 0;
      left: -150%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.08) 50%,
        transparent 100%
      );
      transform: skewX(-25deg);
      pointer-events: none;
      z-index: 20;
      animation: cardLightSweep 6s infinite ease-in-out;
    }

    @keyframes cardLightSweep {
      0% { left: -150%; }
      20% { left: 200%; }
      100% { left: 200%; }
    }

    /* HIỆU ỨNG ÁNH SÁNG QUÉT QUA ĐĨA CD */
    .cd-shimmer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(
        135deg,
        transparent 30%,
        rgba(255, 255, 255, 0.25) 50%,
        transparent 70%
      );
      pointer-events: none;
      z-index: 10;
      mix-blend-mode: overlay;
      opacity: 0.6;
      animation: cdShimmerSweep 4s infinite linear;
    }

    @keyframes cdShimmerSweep {
      0% { transform: rotate(0deg) scale(1); opacity: 0.2; }
      50% { opacity: 0.7; }
      100% { transform: rotate(360deg) scale(1); opacity: 0.2; }
    }

    .coder-credit {
      position: fixed;
      bottom: 8px;
      right: 8px;
      color: #a1a1aa;
      font-family: monospace, sans-serif;
      font-size: 13px;
      padding: 2px 6px;
      border-radius: 6px;
      z-index: 9999;
      pointer-events: none;
    }

    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(39, 39, 42, 0.3); border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 10px; }

    @keyframes spin-cd {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-cd-spin { animation: spin-cd 12s linear infinite; }
    .paused-animation { animation-play-state: paused !important; }

    #player-card {
      will-change: transform;
      transform: translateZ(0);
    }

    /* Hiệu ứng Loang Sóng Ripple */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      transform: scale(0);
      animation: ripple-anim 0.5s ease-out forwards;
      pointer-events: none;
    }
    @keyframes ripple-anim {
      to { transform: scale(2.8); opacity: 0; }
    }

    /* Equalizer */
    .trk-eq {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }
    .trk-eq span {
      width: 2.5px;
      background: #a855f7;
      border-radius: 2px;
      height: 3px;
    }
    .trk-eq.playing span {
      animation: eq-bounce 0.8s ease-in-out infinite alternate;
    }
    .trk-eq span:nth-child(1) { animation-delay: 0.0s; }
    .trk-eq span:nth-child(2) { animation-delay: 0.2s; }
    .trk-eq span:nth-child(3) { animation-delay: 0.4s; }
    .trk-eq span:nth-child(4) { animation-delay: 0.1s; }
    @keyframes eq-bounce {
      0% { height: 3px; }
      100% { height: 12px; }
    }

    #cd-glow {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168,85,247,0.4) 0%, transparent 70%);
      filter: blur(12px);
      opacity: 0.3;
      transition: opacity 0.3s ease;
      z-index: -1;
    }
    #cd-glow.playing { opacity: 0.85; }

    .active-indicator {
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
      will-change: transform;
    }

    @keyframes marquee-seamless-right {
      0% { transform: translate3d(-50%, 0, 0); }
      100% { transform: translate3d(0%, 0, 0); }
    }
    .animate-marquee-right {
      display: flex;
      width: max-content;
      animation: marquee-seamless-right 18s linear infinite;
      will-change: transform;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- Nền ánh sáng động -->
  <div id="bg-stage">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="coder-credit">coder:KENR_VN</div>

  <!-- Main Music Player -->
  <main id="player-card" class="relative w-full max-w-xs h-[540px] bg-zinc-900/90 backdrop-blur-md rounded-3xl p-4 shadow-2xl border border-zinc-800 flex flex-col justify-between overflow-hidden z-10">

    <!-- Dải sáng quét qua Card -->
    <div class="light-sweep"></div>

    <div id="glow-ring"></div>

    <!-- Header Marquee -->
    <div class="w-full overflow-hidden relative pt-1 pb-1 flex items-center">
      <div class="animate-marquee-right flex items-center shrink-0">
        <div class="flex items-center shrink-0">
          <div class="flex items-center gap-2 shrink-0 pr-12">
            <i data-lucide="disc-3" class="w-4 h-4 text-purple-400"></i>
            <span class="text-[10px] font-bold uppercase tracking-widest text-purple-300">JACK - J97 PLAYLIST</span>
          </div>
          <div class="flex items-center gap-2 shrink-0 pr-12">
            <i data-lucide="disc-3" class="w-4 h-4 text-purple-400"></i>
            <span class="text-[10px] font-bold uppercase tracking-widest text-purple-300">JACK - J97 PLAYLIST</span>
          </div>
        </div>
        <div class="flex items-center shrink-0">
          <div class="flex items-center gap-2 shrink-0 pr-12">
            <i data-lucide="disc-3" class="w-4 h-4 text-purple-400"></i>
            <span class="text-[10px] font-bold uppercase tracking-widest text-purple-300">JACK - J97 PLAYLIST</span>
          </div>
          <div class="flex items-center gap-2 shrink-0 pr-12">
            <i data-lucide="disc-3" class="w-4 h-4 text-purple-400"></i>
            <span class="text-[10px] font-bold uppercase tracking-widest text-purple-300">JACK - J97 PLAYLIST</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Đĩa CD -->
    <div id="swipe-zone" class="relative w-36 h-36 mx-auto my-1 shrink-0 flex items-center justify-center cursor-pointer select-none">
      <div id="cd-glow"></div>
      <div id="cd-disc" class="relative w-36 h-36 rounded-full overflow-hidden shadow-xl border-4 border-zinc-800 animate-cd-spin paused-animation">
        
        <!-- Dải sáng phản quang quét qua đĩa CD -->
        <div class="cd-shimmer"></div>

        <img id="cover-art" src="" alt="Cover Art" class="w-full h-full object-cover pointer-events-none select-none opacity-90 transition-opacity duration-200" />
        <div class="absolute inset-0 m-auto w-7 h-7 bg-zinc-900 rounded-full border-2 border-zinc-700 flex items-center justify-center pointer-events-none z-20">
          <div class="w-2.5 h-2.5 bg-purple-500/60 rounded-full"></div>
        </div>
      </div>
    </div>

    <!-- Thông tin bài hát -->
    <div class="text-center mb-1">
      <h1 id="song-title" class="text-base font-bold text-zinc-100 tracking-tight truncate px-2">Đang tải...</h1>
      <p id="artist-name" class="text-[11px] font-medium text-purple-400 truncate">...</p>
    </div>

    <!-- Thanh tiến trình -->
    <div class="space-y-1 mb-2 px-1">
      <div id="progress-bar" class="w-full bg-zinc-800 h-2 rounded-full overflow-hidden cursor-pointer relative">
        <div id="progress-fill" class="bg-purple-500 h-full w-0 rounded-full"></div>
      </div>
      <div class="flex justify-between text-[10px] font-semibold text-zinc-400">
        <span id="current-time">0:00</span>
        <span id="duration-time">0:00</span>
      </div>
    </div>

    <!-- Nút điều khiển -->
    <div class="flex items-center justify-between px-2 mb-3">
      <button id="auto-next-btn" title="Tự động chuyển tiếp" class="text-purple-300 font-bold active:scale-95 transition-transform p-1.5 flex items-center justify-center rounded-lg bg-zinc-800 border border-purple-500/30">
        <i data-lucide="skip-forward" class="w-4 h-4"></i>
      </button>

      <button id="rewind-btn" title="Lùi 5s" class="text-zinc-400 hover:text-purple-300 active:scale-95 transition-transform p-1 flex flex-col items-center">
        <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
        <span class="text-[8px] font-bold -mt-1">5s</span>
      </button>

      <!-- Nút Play/Pause -->
      <button id="play-btn" class="relative overflow-hidden w-11 h-11 rounded-full bg-gradient-to-tr from-purple-600 to-indigo-500 text-white flex items-center justify-center shadow-lg hover:scale-105 active:scale-90 transition-transform shrink-0">
        <svg id="play-icon" class="w-5 h-5 fill-current translate-x-0.5" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="6 3 20 12 6 21 6 3"></polygon>
        </svg>
        <svg id="pause-icon" class="w-5 h-5 fill-current hidden" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="4" width="4" height="16"></rect>
          <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
      </button>

      <button id="forward-btn" title="Tiến 5s" class="text-zinc-400 hover:text-purple-300 active:scale-95 transition-transform p-1 flex flex-col items-center">
        <i data-lucide="rotate-cw" class="w-5 h-5"></i>
        <span class="text-[8px] font-bold -mt-1">5s</span>
      </button>

      <button id="repeat-btn" title="Lặp lại 1 bài" class="text-zinc-500 hover:text-purple-300 active:scale-95 transition-transform p-1.5 flex items-center justify-center rounded-lg">
        <i data-lucide="repeat-1" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Danh sách nhạc -->
    <div id="playlist-container" class="relative flex-1 overflow-y-auto pr-1 space-y-1.5 custom-scrollbar min-h-0">
      <div id="active-indicator" class="active-indicator absolute top-0 left-0 w-full bg-purple-950/40 border border-purple-500/40 rounded-xl pointer-events-none shadow-sm z-0 opacity-0"></div>
      <div id="track-list"></div>
    </div>

  </main>

  <script>
    const songs = [
      { title: "Sóng Gió", artist: "Jack x K-ICM", cover: "https://image-cdn.nct.vn/song/2025/03/23/b/3/e/5/1742667027042_300.jpg", src: "music_01.mp3" },
      { title: "Hồng Nhan", artist: "Jack", cover: "https://image-cdn.nct.vn/song/2024/12/19/1/f/1/d/1734609516223_300.jpg", src: "music_02.mp3" },
      { title: "Bạc Phận", artist: "Jack x K-ICM", cover: "https://image-cdn.nct.vn/song/2025/03/23/b/3/e/5/1742666254013_300.jpg", src: "music_03.mp3" },
      { title: "Em Gì Ơi", artist: "Jack x K-ICM", cover: "https://image-cdn.nct.vn/song/2025/03/23/b/3/e/5/1742666043754_300.jpg", src: "music_04.mp3" },
      { title: "Là 1 Thằng Con Trai", artist: "Jack - J97", cover: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQAENvR32Jhlv_xjd79v-xr9Xd_3eiUVReqB229fmbBOg&s=10", src: "music_05.mp3" },
      { title: "Đom Đóm", artist: "Jack - J97", cover: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6jfAqQKd3ownVQi1buoO0HBhamMbV_bitKPdubFDVyw&s=10", src: "music_06.mp3" },
      { title: "Về Bên Anh", artist: "Jack - J97", cover: "https://image-cdn.nct.vn/song/2024/03/26/5/b/4/c/1711427484011_300.jpg", src: "music_07.mp3" },
      { title: "Ngôi Sao Cô Đơn", artist: "Jack - J97", cover: "https://image-cdn.nct.vn/song/2022/07/16/7/f/f/2/1657976952802_300.jpg", src: "music_08.mp3" },
      { title: "Xóa Tên Anh Đi", artist: "Jack - J97", cover: "https://image-cdn.nct.vn/song/2023/08/09/6/d/c/8/1691559892620_300.jpg", src: "music_09.mp3" },
      { title: "Thiên Lý Ơi", artist: "Jack - J97", cover: "https://image-cdn.nct.vn/song/2024/09/10/d/d/6/f/1725959474440_300.jpg", src: "music_11.mp3" }
    ];

    const audioPlayer = new Audio();
    const indicator = document.getElementById('active-indicator');
    const trackListContainer = document.getElementById('track-list');
    const songTitle = document.getElementById('song-title');
    const artistName = document.getElementById('artist-name');
    const coverArt = document.getElementById('cover-art');
    const cdDisc = document.getElementById('cd-disc');
    const cdGlow = document.getElementById('cd-glow');
    const glowRing = document.getElementById('glow-ring');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const progressBar = document.getElementById('progress-bar');
    const progressFill = document.getElementById('progress-fill');
    const currentTimeEl = document.getElementById('current-time');
    const durationTimeEl = document.getElementById('duration-time');
    const autoNextBtn = document.getElementById('auto-next-btn');
    const repeatBtn = document.getElementById('repeat-btn');

    let currentTrackIndex = 0;
    let trackItems = [];
    let playMode = 'autoNext';

    function addRipple(e, btn) {
      const rect = btn.getBoundingClientRect();
      const circle = document.createElement('span');
      const size = Math.max(rect.width, rect.height);
      circle.className = 'ripple';
      circle.style.width = circle.style.height = `${size}px`;
      circle.style.left = `${(e.clientX ?? rect.left + rect.width / 2) - rect.left - size / 2}px`;
      circle.style.top = `${(e.clientY ?? rect.top + rect.height / 2) - rect.top - size / 2}px`;
      btn.appendChild(circle);
      setTimeout(() => circle.remove(), 500);
    }

    function updateModeUI() {
      if (playMode === 'autoNext') {
        autoNextBtn.className = "text-purple-300 font-bold active:scale-95 transition-transform p-1.5 flex items-center justify-center rounded-lg bg-zinc-800 border border-purple-500/30";
        repeatBtn.className = "text-zinc-500 hover:text-purple-300 active:scale-95 transition-transform p-1.5 flex items-center justify-center rounded-lg";
      } else if (playMode === 'repeatOne') {
        autoNextBtn.className = "text-zinc-500 hover:text-purple-300 active:scale-95 transition-transform p-1.5 flex items-center justify-center rounded-lg";
        repeatBtn.className = "text-purple-300 font-bold active:scale-95 transition-transform p-1.5 flex items-center justify-center rounded-lg bg-zinc-800 border border-purple-500/30";
      } else {
        autoNextBtn.className = "text-zinc-500 hover:text-purple-300 active:scale-95 transition-transform p-1.5 flex items-center justify-center rounded-lg";
        repeatBtn.className = "text-zinc-500 hover:text-purple-300 active:scale-95 transition-transform p-1.5 flex items-center justify-center rounded-lg";
      }
    }

    autoNextBtn.addEventListener('click', () => {
      playMode = playMode === 'autoNext' ? 'none' : 'autoNext';
      updateModeUI();
    });

    repeatBtn.addEventListener('click', () => {
      playMode = playMode === 'repeatOne' ? 'none' : 'repeatOne';
      updateModeUI();
    });

    function renderPlaylist() {
      trackListContainer.innerHTML = songs.map((song, index) => `
        <div class="track-item relative z-10 flex items-center justify-between gap-2.5 px-2.5 py-1.5 rounded-xl active:scale-[0.98] transition-transform cursor-pointer mb-1.5 hover:bg-zinc-800/40"
             data-index="${index}">
          <div class="flex items-center gap-2.5 min-w-0 flex-1 pointer-events-none">
            <img src="${song.cover}" class="w-8 h-8 rounded-lg object-cover shrink-0 border border-zinc-800" />
            <div class="min-w-0 flex-1">
              <p class="text-[11px] font-bold text-zinc-200 truncate leading-snug">${song.title}</p>
              <p class="text-[9px] font-medium text-zinc-400 truncate">${song.artist}</p>
            </div>
          </div>
          <div class="trk-eq hidden" data-eq>
            <span></span><span></span><span></span><span></span>
          </div>
        </div>
      `).join('');

      trackItems = document.querySelectorAll('.track-item');
      trackItems.forEach((item, index) => {
        item.addEventListener('click', () => {
          setActiveTrack(index, true);
        });
      });
    }

    function updatePlayStateUI() {
      const activeEq = trackItems[currentTrackIndex]?.querySelector('.trk-eq');
      if (audioPlayer.paused) {
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
        cdDisc.classList.add('paused-animation');
        cdGlow.classList.remove('playing');
        glowRing.classList.remove('playing');
        activeEq?.classList.remove('playing');
      } else {
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
        cdDisc.classList.remove('paused-animation');
        cdGlow.classList.add('playing');
        glowRing.classList.add('playing');
        activeEq?.classList.add('playing');
      }
    }

    function setActiveTrack(index, shouldPlay = true) {
      if (index < 0 || index >= songs.length) return;

      currentTrackIndex = index;
      const element = trackItems[index];

      indicator.style.transform = `translate3d(0, ${element.offsetTop}px, 0)`;
      indicator.style.height = `${element.offsetHeight}px`;
      indicator.style.opacity = '1';

      trackItems.forEach((item, idx) => {
        const eq = item.querySelector('.trk-eq');
        if (idx === index) {
          eq?.classList.remove('hidden');
          if (!audioPlayer.paused) eq?.classList.add('playing');
        } else {
          eq?.classList.add('hidden');
          eq?.classList.remove('playing');
        }
      });

      songTitle.textContent = songs[index].title;
      artistName.textContent = songs[index].artist;
      coverArt.src = songs[index].cover;

      audioPlayer.src = songs[index].src;

      if (shouldPlay) {
        audioPlayer.play().catch(() => {});
      }
      updatePlayStateUI();
    }

    playBtn.addEventListener('click', (e) => {
      addRipple(e, playBtn);
      if (!audioPlayer.src) {
        setActiveTrack(0, true);
        return;
      }
      if (audioPlayer.paused) {
        audioPlayer.play();
      } else {
        audioPlayer.pause();
      }
      updatePlayStateUI();
    });

    document.getElementById('rewind-btn').addEventListener('click', () => {
      if (audioPlayer.duration) {
        audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 5);
      }
    });

    document.getElementById('forward-btn').addEventListener('click', () => {
      if (audioPlayer.duration) {
        audioPlayer.currentTime = Math.min(audioPlayer.duration, audioPlayer.currentTime + 5);
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        playBtn.click();
      } else if (e.code === 'ArrowLeft') {
        document.getElementById('rewind-btn').click();
      } else if (e.code === 'ArrowRight') {
        document.getElementById('forward-btn').click();
      }
    });

    audioPlayer.addEventListener('timeupdate', () => {
      if (!audioPlayer.duration) return;
      const progressPercent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
      progressFill.style.width = `${progressPercent}%`;

      currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
      durationTimeEl.textContent = formatTime(audioPlayer.duration);
    });

    audioPlayer.addEventListener('ended', () => {
      if (playMode === 'autoNext') {
        const nextIndex = (currentTrackIndex + 1) % songs.length;
        setActiveTrack(nextIndex, true);
      } else if (playMode === 'repeatOne') {
        setActiveTrack(currentTrackIndex, true);
      } else {
        updatePlayStateUI();
      }
    });

    progressBar.addEventListener('click', (e) => {
      if (!audioPlayer.duration) return;
      const rect = progressBar.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const percentage = Math.max(0, Math.min(1, clickX / rect.width));
      audioPlayer.currentTime = percentage * audioPlayer.duration;
    });

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    window.addEventListener('load', () => {
      lucide.createIcons();
      renderPlaylist();
      updateModeUI();
      setActiveTrack(0, false);
    });
  </script>
</body>
</html>
