<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nkhanhdznhattgioi</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .coder-credit {
      position: fixed;
      bottom: 8px;
      right: 8px;
      color: #000000;
      font-family: monospace, sans-serif;
      font-size: 13px;
      padding: 2px 6px;
      border-radius: 6px;
      z-index: 9999;
      pointer-events: none;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(251, 191, 36, 0.2);
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #f59e0b;
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #d97706;
    }

    @keyframes spin-cd {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-cd-spin {
      animation: spin-cd 10s linear infinite;
    }
    .paused-animation {
      animation-play-state: paused !important;
    }

    .active-indicator {
      transition: transform 0.2s ease, height 0.2s ease, opacity 0.2s ease;
      box-sizing: border-box;
    }

    @keyframes marquee-seamless-right {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(0%); }
    }

    .animate-marquee-right {
      display: flex;
      width: max-content;
      animation: marquee-seamless-right 16s linear infinite;
      will-change: transform;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-amber-200 via-yellow-100 to-amber-300 flex items-center justify-center p-4">

  <div class="coder-credit">coder:KENR_VN</div>

  <main class="w-full max-w-xs aspect-[3/4] h-[540px] bg-white/80 backdrop-blur-md rounded-3xl p-4 shadow-2xl shadow-amber-500/20 border border-white/80 relative flex flex-col justify-between overflow-hidden">
    
    <!-- Header -->
    <div class="w-full overflow-hidden relative pt-1 pb-1 flex items-center">
      <div class="animate-marquee-right flex items-center shrink-0">
        <div class="flex items-center shrink-0">
          <div class="flex items-center gap-2 shrink-0 pr-16">
            <i data-lucide="disc-3" class="w-4 h-4 text-amber-500"></i>
            <span class="text-[10px] font-bold uppercase tracking-widest text-amber-700">JACK - J97 PLAYLIST</span>
          </div>
          <div class="flex items-center gap-2 shrink-0 pr-16">
            <i data-lucide="disc-3" class="w-4 h-4 text-amber-500"></i>
            <span class="text-[10px] font-bold uppercase tracking-widest text-amber-700">JACK - J97 PLAYLIST</span>
          </div>
          <div class="flex items-center gap-2 shrink-0 pr-16">
            <i data-lucide="disc-3" class="w-4 h-4 text-amber-500"></i>
            <span class="text-[10px] font-bold uppercase tracking-widest text-amber-700">JACK - J97 PLAYLIST</span>
          </div>
        </div>

        <div class="flex items-center shrink-0">
          <div class="flex items-center gap-2 shrink-0 pr-16">
            <i data-lucide="disc-3" class="w-4 h-4 text-amber-500"></i>
            <span class="text-[10px] font-bold uppercase tracking-widest text-amber-700">JACK - J97 PLAYLIST</span>
          </div>
          <div class="flex items-center gap-2 shrink-0 pr-16">
            <i data-lucide="disc-3" class="w-4 h-4 text-amber-500"></i>
            <span class="text-[10px] font-bold uppercase tracking-widest text-amber-700">JACK - J97 PLAYLIST</span>
          </div>
          <div class="flex items-center gap-2 shrink-0 pr-16">
            <i data-lucide="disc-3" class="w-4 h-4 text-amber-500"></i>
            <span class="text-[10px] font-bold uppercase tracking-widest text-amber-700">JACK - J97 PLAYLIST</span>
          </div>
        </div>
      </div>
    </div>

    <!-- CD -->
    <div id="swipe-zone" class="relative w-36 h-36 mx-auto my-1 shrink-0 flex items-center justify-center cursor-grab active:cursor-grabbing">
      <div id="cd-disc" class="relative w-36 h-36 rounded-full overflow-hidden shadow-xl shadow-amber-300/60 border-4 border-white/90 animate-cd-spin paused-animation">
        <img id="cover-art" src="" alt="Cover Art" class="w-full h-full object-cover pointer-events-none select-none" />
        <div class="absolute inset-0 m-auto w-7 h-7 bg-white/90 rounded-full border-2 border-amber-200 shadow-inner flex items-center justify-center pointer-events-none">
          <div class="w-2.5 h-2.5 bg-amber-300/50 rounded-full"></div>
        </div>
      </div>
    </div>

    <!-- Info -->
    <div class="text-center mb-1">
      <h1 id="song-title" class="text-base font-bold text-amber-700 tracking-tight truncate px-2">Đang tải...</h1>
      <p id="artist-name" class="text-[11px] font-medium text-amber-500 truncate">...</p>
    </div>

    <!-- Progress -->
    <div class="space-y-1 mb-2 px-1">
      <div id="progress-bar" class="w-full bg-amber-100 h-2 rounded-full overflow-hidden cursor-pointer relative group">
        <div id="progress-fill" class="bg-gradient-to-r from-amber-400 to-yellow-500 h-full w-0 rounded-full relative">
          <div class="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white border-2 border-amber-500 rounded-full shadow scale-0 group-hover:scale-100 transition-transform"></div>
        </div>
      </div>
      <div class="flex justify-between text-[10px] font-semibold text-amber-500">
        <span id="current-time">0:00</span>
        <span id="duration-time">0:00</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex items-center justify-between px-2 mb-3">
      <button id="auto-next-btn" title="Tự động chuyển tiếp (Đang bật)" class="text-amber-700 font-bold active:scale-90 transition-all p-1.5 flex items-center justify-center rounded-lg bg-amber-100 border border-amber-300 shadow-sm">
        <i data-lucide="skip-forward" class="w-4 h-4"></i>
      </button>

      <button id="rewind-btn" title="Lùi 5s" class="text-amber-500 hover:text-amber-700 active:scale-85 transition-all p-1 flex flex-col items-center">
        <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
        <span class="text-[8px] font-bold -mt-1">5s</span>
      </button>

      <button id="play-btn" class="w-11 h-11 rounded-full bg-gradient-to-tr from-amber-500 to-yellow-400 text-white flex items-center justify-center shadow-lg shadow-amber-300 hover:scale-105 active:scale-90 transition-all shrink-0">
        <i data-lucide="play" class="w-5 h-5 fill-current translate-x-0.5"></i>
      </button>

      <button id="forward-btn" title="Tiến 5s" class="text-amber-500 hover:text-amber-700 active:scale-85 transition-all p-1 flex flex-col items-center">
        <i data-lucide="rotate-cw" class="w-5 h-5"></i>
        <span class="text-[8px] font-bold -mt-1">5s</span>
      </button>

      <button id="repeat-btn" title="Lặp lại 1 bài (Đang tắt)" class="text-amber-400 hover:text-amber-700 active:scale-90 transition-all p-1.5 flex items-center justify-center rounded-lg">
        <i data-lucide="repeat-1" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Playlist -->
    <div id="playlist-container" class="relative flex-1 overflow-y-auto pr-1 space-y-1.5 custom-scrollbar min-h-0">
      <div id="active-indicator" class="active-indicator absolute top-0 left-0 w-full bg-amber-100/90 border-2 border-amber-400 rounded-xl pointer-events-none shadow-sm z-0 opacity-0"></div>
      <div id="track-list"></div>
    </div>

  </main>

  <script>
    const songs = [
      { title: "Sóng Gió", artist: "Jack x K-ICM", cover: "https://image-cdn.nct.vn/song/2025/03/23/b/3/e/5/1742667027042_300.jpg", src: "music_01.mp3" },
      { title: "Hồng Nhan", artist: "Jack", cover: "https://image-cdn.nct.vn/song/2024/12/19/1/f/1/d/1734609516223_300.jpg", src: "music_02.mp3" },
      { title: "Bạc Phận", artist: "Jack x K-ICM", cover: "https://image-cdn.nct.vn/song/2025/03/23/b/3/e/5/1742666254013_300.jpg", src: "music_03.mp3" },
      { title: "Em Gì Ơi", artist: "Jack x K-ICM", cover: "https://image-cdn.nct.vn/song/2025/03/23/b/3/e/5/1742666043754_300.jpg", src: "music_04.mp3" },
      { title: "Là 1 Thằng Con Trai", artist: "Jack - J97", cover: "https://image-cdn.nct.vn/song/2020/03/10/e/a/7/f/1583842188408_300.jpg", src: "music_05.mp3" },
      { title: "Đom Đóm", artist: "Jack - J97", cover: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6jfAqQKd3ownVQi1buoO0HBhamMbV_bitKPdubFDVyw&s=10", src: "music_06.mp3" },
      { title: "Về Bên Anh", artist: "Jack - J97", cover: "https://image-cdn.nct.vn/song/2024/03/26/5/b/4/c/1711427484011_300.jpg", src: "music_07.mp3" },
      { title: "Ngôi Sao Cô Đơn", artist: "Jack - J97", cover: "https://image-cdn.nct.vn/song/2022/07/16/7/f/f/2/1657976952802_300.jpg", src: "music_08.mp3" },
      { title: "Xóa Tên Anh Đi", artist: "Jack - J97", cover: "https://image-cdn.nct.vn/song/2023/08/09/6/d/c/8/1691559892620_300.jpg", src: "music_09.mp3" },
      { title: "Việt Nam Tôi", artist: "Jack x K-ICM", cover: "https://image-cdn.nct.vn/song/2019/11/30/d/b/7/8/1575102666606_300.jpg", src: "music_10.mp3" },
      { title: "Thiên Lý Ơi", artist: "Jack - J97", cover: "https://image-cdn.nct.vn/song/2024/09/10/d/d/6/f/1725959474440_300.jpg", src: "music_11.mp3" }
    ];

    const audioPlayer = new Audio();
    const indicator = document.getElementById('active-indicator');
    const trackListContainer = document.getElementById('track-list');
    const songTitle = document.getElementById('song-title');
    const artistName = document.getElementById('artist-name');
    const coverArt = document.getElementById('cover-art');
    const cdDisc = document.getElementById('cd-disc');
    const playBtn = document.getElementById('play-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressFill = document.getElementById('progress-fill');
    const currentTimeEl = document.getElementById('current-time');
    const durationTimeEl = document.getElementById('duration-time');
    
    const autoNextBtn = document.getElementById('auto-next-btn');
    const repeatBtn = document.getElementById('repeat-btn');

    let currentTrackIndex = 0;
    let trackItems = [];
    let playMode = 'autoNext'; 

    function updateModeUI() {
      if (playMode === 'autoNext') {
        autoNextBtn.className = "text-amber-700 font-bold active:scale-90 transition-all p-1.5 flex items-center justify-center rounded-lg bg-amber-100 border border-amber-300 shadow-sm";
        autoNextBtn.title = "Tự động chuyển tiếp (Đang bật)";
        repeatBtn.className = "text-amber-400 hover:text-amber-700 active:scale-90 transition-all p-1.5 flex items-center justify-center rounded-lg";
        repeatBtn.title = "Lặp lại 1 bài (Đang tắt)";
      } else if (playMode === 'repeatOne') {
        autoNextBtn.className = "text-amber-400 hover:text-amber-700 active:scale-90 transition-all p-1.5 flex items-center justify-center rounded-lg";
        autoNextBtn.title = "Tự động chuyển tiếp (Đang tắt)";
        repeatBtn.className = "text-amber-700 font-bold active:scale-90 transition-all p-1.5 flex items-center justify-center rounded-lg bg-amber-100 border border-amber-300 shadow-sm";
        repeatBtn.title = "Lặp lại 1 bài (Đang bật)";
      } else {
        autoNextBtn.className = "text-amber-400 hover:text-amber-700 active:scale-90 transition-all p-1.5 flex items-center justify-center rounded-lg";
        autoNextBtn.title = "Tự động chuyển tiếp (Đang tắt)";
        repeatBtn.className = "text-amber-400 hover:text-amber-700 active:scale-90 transition-all p-1.5 flex items-center justify-center rounded-lg";
        repeatBtn.title = "Lặp lại 1 bài (Đang tắt)";
      }
      lucide.createIcons();
    }

    autoNextBtn.addEventListener('click', () => {
      playMode = playMode === 'autoNext' ? 'none' : 'autoNext';
      updateModeUI();
    });

    repeatBtn.addEventListener('click', () => {
      playMode = playMode === 'repeatOne' ? 'none' : 'repeatOne';
      updateModeUI();
    });

    function renderPlaylist() {
      trackListContainer.innerHTML = songs.map((song, index) => `
        <div class="track-item relative z-10 flex items-center justify-between gap-2.5 px-2.5 py-1.5 rounded-xl active:scale-[0.98] transition-all cursor-pointer mb-1.5"
             data-index="${index}">
          <div class="flex items-center gap-2.5 min-w-0 flex-1 pointer-events-none">
            <img src="${song.cover}" class="w-8 h-8 rounded-lg object-cover shrink-0" />
            <div class="min-w-0 flex-1">
              <p class="text-[11px] font-bold text-amber-700 truncate leading-snug">${song.title}</p>
              <p class="text-[9px] font-medium text-amber-500 truncate">${song.artist}</p>
            </div>
          </div>
          <i data-lucide="volume-2" class="volume-icon w-3.5 h-3.5 text-amber-600 animate-pulse shrink-0 hidden"></i>
        </div>
      `).join('');

      lucide.createIcons();
      trackItems = document.querySelectorAll('.track-item');

      trackItems.forEach((item, index) => {
        item.addEventListener('click', () => {
          setActiveTrack(index, true);
        });
      });
    }

    function updatePlayStateUI() {
      if (audioPlayer.paused) {
        playBtn.innerHTML = '<i data-lucide="play" class="w-5 h-5 fill-current translate-x-0.5"></i>';
        cdDisc.classList.add('paused-animation');
      } else {
        playBtn.innerHTML = '<i data-lucide="pause" class="w-5 h-5 fill-current"></i>';
        cdDisc.classList.remove('paused-animation');
      }
      lucide.createIcons();
    }

    // Đổi bài tức thì, phản hồi ngay không tạo trễ
    function setActiveTrack(index, shouldPlay = true) {
      if (index < 0 || index >= songs.length) return;
      
      currentTrackIndex = index;
      const element = trackItems[index];

      indicator.style.transform = `translateY(${element.offsetTop}px)`;
      indicator.style.height = `${element.offsetHeight}px`;
      indicator.style.opacity = '1';

      trackItems.forEach((item, idx) => {
        const icon = item.querySelector('.volume-icon');
        if (idx === index) {
          icon?.classList.remove('hidden');
        } else {
          icon?.classList.add('hidden');
        }
      });

      songTitle.textContent = songs[index].title;
      artistName.textContent = songs[index].artist;
      coverArt.src = songs[index].cover;

      audioPlayer.src = songs[index].src;

      if (shouldPlay) {
        audioPlayer.play().catch(() => {});
      }
      updatePlayStateUI();
    }

    playBtn.addEventListener('click', () => {
      if (!audioPlayer.src) {
        setActiveTrack(0, true);
        return;
      }
      if (audioPlayer.paused) {
        audioPlayer.play();
      } else {
        audioPlayer.pause();
      }
      updatePlayStateUI();
    });

    document.getElementById('rewind-btn').addEventListener('click', () => {
      if (audioPlayer.duration) {
        audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 5);
      }
    });

    document.getElementById('forward-btn').addEventListener('click', () => {
      if (audioPlayer.duration) {
        audioPlayer.currentTime = Math.min(audioPlayer.duration, audioPlayer.currentTime + 5);
      }
    });

    audioPlayer.addEventListener('timeupdate', () => {
      if (!audioPlayer.duration) return;
      const progressPercent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
      progressFill.style.width = `${progressPercent}%`;

      currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
      durationTimeEl.textContent = formatTime(audioPlayer.duration);
    });

    audioPlayer.addEventListener('ended', () => {
      if (playMode === 'autoNext') {
        const nextIndex = (currentTrackIndex + 1) % songs.length;
        setActiveTrack(nextIndex, true);
      } else if (playMode === 'repeatOne') {
        setActiveTrack(currentTrackIndex, true);
      } else {
        updatePlayStateUI();
      }
    });

    progressBar.addEventListener('click', (e) => {
      if (!audioPlayer.duration) return;
      const rect = progressBar.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const percentage = Math.max(0, Math.min(1, clickX / rect.width));
      audioPlayer.currentTime = percentage * audioPlayer.duration;
    });

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    window.addEventListener('load', () => {
      renderPlaylist();
      updateModeUI();
      setTimeout(() => {
        setActiveTrack(0, false);
      }, 50);
    });
  </script>
</body>
</html>
